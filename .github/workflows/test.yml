name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Audit production dependencies
        run: bun audit --production
      - run: bun run check
      - name: Test Redis/Valkey multi-host coordination
        run: bun run test:redis
        env:
          KIWIMU_TEST_REDIS_URL: redis://127.0.0.1:6379
      - name: Build demo site smoke test
        run: |
          demo_dir="$(mktemp -d)"
          cd "$demo_dir"
          bun run "$GITHUB_WORKSPACE/src/index.ts" init --demo --no-serve
          test -s _site/index.html
      - name: Test packed production consumer
        run: |
          pack_dir="$(mktemp -d)"
          bun pm pack --destination "$pack_dir" --quiet
          archive="$(find "$pack_dir" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$archive"
          consumer_dir="$(mktemp -d)"
          printf '{"private":true,"dependencies":{"@open330/kiwimu":"file:%s"}}\n' "$archive" > "$consumer_dir/package.json"
          cd "$consumer_dir"
          bun install
          bun audit --production
          test "$(./node_modules/.bin/kiwimu --version)" = "$(jq -r .version "$GITHUB_WORKSPACE/package.json")"
          demo_dir="$(mktemp -d)"
          cd "$demo_dir"
          "$consumer_dir/node_modules/.bin/kiwimu" init "Packed Demo" --demo --no-serve
          test -s _site/index.html
          test -s _site/static/vendor/mermaid/mermaid.min.js
      - name: Validate Compose deployment configuration
        run: |
          docker compose config --quiet
          docker compose --profile external config --quiet
      - name: Build and smoke-test production image
        run: |
          image="kiwimu-ci:${GITHUB_SHA}"
          container="kiwimu-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --tag "$image" .
          docker run --detach --name "$container" --publish 127.0.0.1:18000:8000 \
            --env KIWIMU_AUTH_TOKEN=kiwimu-ci-auth-token "$image"
          cleanup() { docker rm --force "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          test "$(docker inspect --format '{{.Config.User}}' "$container")" = "bun"
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused --retry-all-errors \
            http://127.0.0.1:18000/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:18000/health/ready >/dev/null
          docker stop --time 30 "$container" >/dev/null
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = "0"
      - name: Install Chromium for E2E
        run: bunx playwright install --with-deps chromium
      - name: Run browser E2E
        run: bun run test:e2e
      - name: Run browser E2E with Redis coordination
        run: bun run test:e2e
        env:
          KIWIMU_COORDINATOR_URL: redis://127.0.0.1:6379
          KIWIMU_COORDINATOR_NAMESPACE: ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

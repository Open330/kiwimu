<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ wiki_name }}{% endblock %}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/static/favicon.png">
    <link rel="apple-touch-icon" href="/static/logo.png">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body>
    <nav class="topbar">
        <a href="/index.html" class="topbar-brand"><img src="/static/logo.png" alt="kiwimu" class="topbar-logo">{{ wiki_name }}</a>
        <div class="topbar-search">
            <input type="text" id="search-input" placeholder="문서 검색..." autocomplete="off">
            <div id="search-results" class="search-dropdown"></div>
        </div>
        <div class="topbar-links">
            <a href="/graph.html" class="btn-graph">📊 지식 그래프</a>
        </div>
    </nav>

    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">문서 목록</div>
            <ul class="page-list">
                {% for p in all_pages %}
                <li><a href="/wiki/{{ p.slug }}.html" {% if p.slug == page_slug|default('') %}class="active"{% endif %}>{{ p.title }}</a></li>
                {% endfor %}
            </ul>
        </aside>

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="/static/search.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false},
                    {left: "\\(", right: "\\)", display: false},
                    {left: "\\[", right: "\\]", display: true}
                ]
            });
        });
    </script>
</body>
</html>

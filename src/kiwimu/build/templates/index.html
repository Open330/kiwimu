{% extends "base.html" %}
{% block title %}{{ wiki_name }} - 대문{% endblock %}

{% block content %}
<div class="index-page">
    <div class="hero">
        <img src="/static/logo.png" alt="kiwimu logo" class="hero-logo">
        <h1>{{ wiki_name }}</h1>
        <p class="hero-sub">나만의 학습 위키 · {{ page_count }}개 문서 · {{ source_count }}개 소스</p>
    </div>

    <div class="index-grid">
        <section class="index-section">
            <h2>전체 문서</h2>
            <div class="page-cards">
                {% for p in all_pages %}
                <a href="/wiki/{{ p.slug }}.html" class="page-card">
                    <span class="card-title">{{ p.title }}</span>
                </a>
                {% endfor %}
            </div>
        </section>

        <section class="index-section">
            <h2>빠른 탐색</h2>
            <div class="quick-links">
                <a href="/graph.html" class="quick-link">📊 지식 그래프 보기</a>
            </div>
        </section>
    </div>
</div>
{% endblock %}
